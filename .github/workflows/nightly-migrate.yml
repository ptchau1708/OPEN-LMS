# Đồng bộ hằng đêm OpenLMS (public) → OPEN-EDU (v2) trong thời gian thí điểm. Xem docs/CUTOVER.md.
# Cần secret DATABASE_URL (Supabase → Project Settings → Database → Connection string, Session pooler, vai trò postgres).
# Tắt workflow này vào ngày chuyển hẳn (sau lần chạy cuối có --cleanup).
name: Đồng bộ dữ liệu app cũ (hằng đêm)
on:
  schedule: [{ cron: '7 19 * * *' }]      # 02:07 giờ Việt Nam
  workflow_dispatch:
    inputs:
      dry_run: { description: 'Chỉ chạy thử (ROLLBACK)', type: boolean, default: false }
permissions: { contents: read }
concurrency: { group: nightly-migrate, cancel-in-progress: false }

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production                # bật "Required reviewers" nếu muốn duyệt tay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Chạy ETL + đối soát
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node tools/migrate-v1/run.mjs ${{ inputs.dry_run && '--dry-run' || '' }} --out reports
      - uses: actions/upload-artifact@v4   # chỉ số đếm + command tag, không có tên HS
        if: always()
        with:
          name: reconcile-${{ github.run_id }}
          path: reports/
          retention-days: 14
