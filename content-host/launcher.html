<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>OPEN-EDU · Bài chơi</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #ffffff;
      color: #22304a;
      font-family: "Nunito", "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #stage { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
    #stage > iframe { display: block; width: 100%; height: 100%; border: 0; }
    #stage > .h5p-host { width: 100%; height: 100%; overflow: auto; }
    #msg {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; text-align: center; font-size: 20px; font-weight: 700; background: #eaf4ff;
    }
    #msg[hidden] { display: none; }
    #msg small { display: block; margin-top: 8px; font-size: 15px; font-weight: 400; color: #5a6a86; }
    #msg.is-error { background: #fff1e0; }
  </style>
  <!--
    Tùy chọn: chỉ gửi kết quả cho các app được phép. Bỏ comment và điền origin của app.
    <script>window.OPENEDU_PARENT_ORIGINS = ['https://hoc.openedu.vn', 'https://lop.openedu.vn'];</script>
  -->
</head>
<body>
  <div id="stage"></div>
  <div id="msg" role="status">Đang mở bài chơi…</div>
  <script src="launcher.js"></script>
</body>
</html>
